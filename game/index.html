<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmara Bay</title>
<meta name="description" content="Solmara Bay: an original open-world crime game in the browser. A bay city to explore on foot, by car and by boat, ten story missions, shops and a garage to walk into.">
<meta name="theme-color" content="#0d1020">
<link rel="icon" href="data:,">
<style>
  :root {
    --sun: #ffb347; --pink: #ff5fa2; --teal: #2ec4b6; --ink: #0d1020;
    --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --display: "Avenir Next Condensed", "Futura", "Arial Narrow", "Avenir Next", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; font-family: var(--font); color: #fff; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#ff9a6a, #5a5fae); font: 800 42px var(--display); letter-spacing: 6px; }

  /* ------------------------------------------------ HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 3px rgba(0,0,0,.75); }
  .hud-vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(200,0,0,.65) 100%); }
  .hud-cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  .hud-cross::before, .hud-cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  .hud-cross::before { left: 10px; top: 0; width: 2px; height: 22px; }
  .hud-cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
  .hud-cross.aim { transform: scale(.7); }
  .hud-tr { position: absolute; right: 28px; top: 22px; text-align: right; }
  .hud-clock { font: 700 22px var(--display); letter-spacing: 2px; opacity: .92; }
  .hud-stars { margin: 2px 0 2px; font-size: 34px; line-height: 1; letter-spacing: 2px; }
  .hud-stars .star { color: rgba(255,255,255,.18); -webkit-text-stroke: 1px rgba(0,0,0,.5); }
  .hud-stars .star.on { color: #fff; }
  .hud-stars .star.blink { color: #ffd23f; }
  .hud-money { font: 800 40px var(--display); color: #8dff9e; letter-spacing: 1px; -webkit-text-stroke: 1px #0a3d1a; }
  .wpn { margin-top: 8px; margin-left: auto; display: flex; align-items: center; gap: 12px; width: 300px; padding: 8px 14px 10px 10px; background: linear-gradient(270deg, rgba(10,14,30,.82), rgba(10,14,30,.45)); border-right: 4px solid var(--sun); border-radius: 8px; box-sizing: border-box; }
  .wpn.pop { animation: wpnpop .28s ease-out; }
  @keyframes wpnpop { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .wpn-icon { width: 118px; height: 53px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
  .wpn-info { flex: 1; text-align: right; }
  .wpn-name { font: 800 16px var(--display); letter-spacing: 2px; text-transform: uppercase; color: #ffd27a; }
  .wpn-ammo { line-height: 1; margin-top: 2px; }
  .wpn-clip { font: 900 34px var(--display); }
  .wpn-reserve { font: 700 15px var(--font); opacity: .8; margin-left: 4px; }
  .wpn.low .wpn-clip { color: #ff5252; }
  .wpn-bar { height: 5px; margin-top: 5px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .wpn-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #ffe66d); transition: width .1s; }
  .wpn-strip { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; opacity: 0; transition: opacity .3s; }
  .wpn-strip.on { opacity: 1; }
  .wpn-slot { position: relative; width: 66px; height: 38px; display: grid; place-items: center; background: rgba(10,14,30,.6); border-radius: 6px; border: 2px solid transparent; opacity: .3; }
  .wpn-slot.owned { opacity: .85; }
  .wpn-slot.current { border-color: var(--sun); opacity: 1; background: rgba(255,179,71,.25); }
  .wpn-slot img { width: 54px; height: 24px; object-fit: contain; }
  .wpn-slot kbd { position: absolute; left: -4px; top: -6px; min-width: 12px; padding: 0 4px; font-size: 10px; }
  .wpn-wheel { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px; opacity: 0; transform: scale(.85); transition: opacity .15s, transform .15s; pointer-events: none; }
  .wpn-wheel.on { opacity: 1; transform: scale(1); }
  .wheel-ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(10,14,30,.25) 0 26%, rgba(10,14,30,.78) 27% 70%, rgba(10,14,30,0) 71%); border: 2px solid rgba(255,255,255,.12); }
  .wheel-item { position: absolute; width: 150px; margin: -48px 0 0 -75px; text-align: center; opacity: .25; transition: transform .12s, opacity .12s; }
  .wheel-item.owned { opacity: .7; }
  .wheel-item.sel { opacity: 1; transform: scale(1.15); }
  .wheel-item.sel img { filter: drop-shadow(0 0 10px #ffb347); }
  .wheel-item img { width: 120px; height: 54px; object-fit: contain; }
  .wheel-name { font: 800 14px var(--display); letter-spacing: 2px; text-transform: uppercase; }
  .wheel-ammo { font: 600 13px var(--font); color: #ffd27a; }
  .wheel-centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 900 18px var(--display); letter-spacing: 2px; text-transform: uppercase; color: #ffb347; text-align: center; width: 120px; }
  .hud-bl { position: absolute; left: 26px; bottom: 24px; width: 236px; }
  .hud-map { width: 236px; height: 236px; border-radius: 50%; overflow: hidden; border: 4px solid rgba(15,18,35,.85); box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.15); background: #2a8fb8; }
  .hud-bars { display: flex; gap: 6px; margin-top: 8px; }
  .bar { flex: 1; height: 10px; background: rgba(0,0,0,.55); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  .bar i { display: block; height: 100%; width: 100%; transition: width .2s; }
  .bar.hp i { background: linear-gradient(90deg, #3ddc64, #9dff6a); }
  .bar.hp.low i { background: #ff4b4b; }
  .bar.ar i { background: linear-gradient(90deg, #3a86ff, #7ab8ff); }
  .hud-obj { position: absolute; left: 26px; top: 22px; max-width: 420px; padding: 10px 16px 12px; background: linear-gradient(90deg, rgba(10,14,30,.78), rgba(10,14,30,.25)); border-left: 4px solid var(--pink); border-radius: 4px; }
  .o-title { font: 800 14px var(--display); letter-spacing: 3px; color: var(--pink); text-transform: uppercase; }
  .o-text { font: 600 19px var(--font); margin-top: 3px; }
  .hud-timer { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font: 800 38px var(--display); letter-spacing: 2px; }
  .hud-timer.low { color: #ff5252; }
  .hud-sub { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: 860px; padding: 8px 18px; text-align: center; font: 600 22px var(--font); background: rgba(0,0,0,.45); border-radius: 6px; }
  .hud-sub b { margin-right: 6px; letter-spacing: 1px; }
  .hud-help { position: absolute; left: 26px; top: 150px; max-width: 340px; padding: 10px 14px; background: rgba(10,14,30,.8); border-radius: 6px; font: 600 16px var(--font); border: 1px solid rgba(255,255,255,.15); }
  .hud-shop { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); width: 330px; padding: 14px 16px; background: rgba(10,14,30,.88); border-top: 4px solid #ff7043; border-radius: 6px; text-shadow: none; }
  .s-title { font: 800 18px var(--display); letter-spacing: 3px; color: #ff7043; margin-bottom: 8px; }
  .s-row { display: flex; gap: 10px; align-items: center; padding: 5px 0; font-size: 15px; }
  .s-row span { flex: 1; }
  .s-row em { font-style: normal; color: #8dff9e; font-weight: 700; }
  .s-row.poor { opacity: .45; }
  .s-foot { margin-top: 8px; font-size: 12px; opacity: .7; }
  kbd { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 4px; background: #fff; color: #111; font: 700 13px var(--font); text-align: center; text-shadow: none; }
  .hud-notes { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .note { padding: 7px 16px; background: rgba(10,14,30,.8); border-radius: 18px; font: 600 16px var(--font); transition: opacity .5s, transform .5s; }
  .note.out { opacity: 0; transform: translateY(-8px); }
  .hud-big { position: absolute; left: 0; right: 0; top: 34%; text-align: center; opacity: 0; transition: opacity .4s; }
  .hud-big.on { opacity: 1; }
  .b-title { font: italic 900 74px var(--display); letter-spacing: 4px; -webkit-text-stroke: 2px rgba(0,0,0,.6); }
  .b-sub { font: 600 22px var(--font); margin-top: 4px; }
  .hud-big.grim { top: 0; bottom: 0; padding-top: 40vh; background: rgba(40,0,0,.35); }
  .hud-big.grim .b-title { font-size: 110px; letter-spacing: 10px; }
  .hud-br { position: absolute; right: 28px; bottom: 24px; text-align: right; }
  .hud-popup { font: italic 900 38px var(--display); letter-spacing: 2px; opacity: 0; transition: opacity .5s; -webkit-text-stroke: 1px rgba(0,0,0,.6); }
  .hud-popup.on { opacity: 1; }
  .hud-radio { opacity: 0; transition: opacity .5s; margin-top: 2px; }
  .hud-radio.on { opacity: 1; }
  .hud-radio b { display: block; font: 800 22px var(--display); letter-spacing: 3px; color: var(--sun); }
  .hud-radio span { font-size: 14px; opacity: .85; }
  .hud-speed { margin-top: 6px; }
  .hud-speed b { font: 900 54px var(--display); }
  .hud-speed span { font: 700 16px var(--font); margin-left: 4px; opacity: .85; }
  .v-hp { width: 150px; height: 6px; margin: 4px 0 0 auto; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; }
  .v-hp i { display: block; height: 100%; }

  /* ------------------------------------------------ menus */
  #menu:empty { display: none; }
  .menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start; padding-left: 7vw; background: linear-gradient(90deg, rgba(13,16,32,.82) 0%, rgba(13,16,32,.35) 45%, rgba(13,16,32,0) 70%); }
  .menu.pause, .menu.info, .menu.map { background: rgba(13,16,32,.72); justify-content: center; padding-left: 0; }
  .panel { min-width: 360px; max-width: 900px; }
  .logo { margin-bottom: 26px; position: relative; }
  .logo-sun { position: absolute; left: -10px; top: -26px; width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(#ffe66d, #ff5fa2 70%); opacity: .9; z-index: -1; box-shadow: 0 0 60px rgba(255,95,162,.6); }
  .logo h1 { margin: 0; font: italic 900 96px/0.9 var(--display); letter-spacing: 3px; color: #fff; text-shadow: 4px 4px 0 #ff5fa2, 8px 8px 0 rgba(0,0,0,.35); }
  .logo h1 span { display: block; font-size: 64px; color: #ffe66d; letter-spacing: 22px; text-shadow: 3px 3px 0 #2ec4b6, 6px 6px 0 rgba(0,0,0,.35); }
  .logo p { margin: 14px 0 0; font: 600 18px var(--font); letter-spacing: 6px; text-transform: uppercase; color: #bde0fe; }
  .panel h2 { font: italic 900 52px var(--display); letter-spacing: 4px; margin: 0 0 18px; text-shadow: 3px 3px 0 #ff5fa2; }
  .items { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .items button { all: unset; cursor: pointer; padding: 8px 18px 8px 14px; font: 800 26px var(--display); letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.75); border-left: 4px solid transparent; transition: all .12s; }
  .items button small { display: block; font: 500 13px var(--font); letter-spacing: .5px; text-transform: none; opacity: .75; margin-top: 2px; }
  .items button.sel { color: #fff; border-left-color: var(--sun); background: linear-gradient(90deg, rgba(255,179,71,.3), transparent); padding-left: 22px; }
  .items button.off { opacity: .35; }
  .foot { margin-top: 30px; font-size: 13px; opacity: .6; letter-spacing: 1px; }
  table.kv { border-collapse: collapse; margin-bottom: 18px; font-size: 17px; }
  table.kv td { padding: 5px 22px 5px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  table.kv td:last-child { color: #ffd27a; }
  .settings { display: grid; gap: 14px; margin-bottom: 18px; font-size: 17px; }
  .settings label { display: flex; justify-content: space-between; gap: 30px; align-items: center; }
  .settings input[type=range] { width: 220px; accent-color: var(--sun); }
  .credits { max-width: 560px; font-size: 16px; line-height: 1.55; margin-bottom: 14px; }
  .bigmap { width: min(84vh, 760px); height: min(84vh, 760px); border-radius: 12px; border: 4px solid rgba(255,255,255,.22); display: block; box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: crosshair; }
  .menu.map .panel { max-width: none; }
  .menu.map .items { margin-top: 8px; }
  .menu.map .panel > h2:empty { display: none; }
  .mapwrap { display: flex; gap: 26px; align-items: flex-start; }
  .mapbox { position: relative; }
  .mapcard { position: absolute; display: none; gap: 12px; align-items: center; width: 310px; padding: 10px 14px 10px 10px; background: rgba(10,14,30,.94); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); pointer-events: none; }
  .mapcard img { width: 70px; height: 70px; flex: none; }
  .mapcard i { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .mapcard b { display: block; font: 800 18px var(--display); letter-spacing: 1px; }
  .mapcard span { display: block; font-size: 13px; opacity: .85; margin-top: 2px; }
  .mapcard em { display: block; font-style: normal; font-size: 12px; color: #ffd27a; margin-top: 4px; }
  .maptools { position: absolute; left: 14px; top: 14px; display: flex; gap: 6px; }
  .maptools button { all: unset; cursor: pointer; padding: 5px 11px; background: rgba(10,14,30,.85); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; font: 800 14px var(--display); letter-spacing: 1px; }
  .maptools button:hover { background: rgba(255,179,71,.35); }
  .maphint { position: absolute; left: 0; right: 0; bottom: -24px; text-align: center; font-size: 12px; opacity: .65; }
  .mapside { width: 330px; }
  .mapside h2 { margin: 0 0 10px; font-size: 40px; }
  .mapobj { padding: 9px 12px; margin-bottom: 12px; background: rgba(255,95,162,.15); border-left: 4px solid var(--pink); border-radius: 4px; font-size: 14px; }
  .mapobj b { display: block; font: 800 12px var(--display); letter-spacing: 2px; color: var(--pink); text-transform: uppercase; }
  .people { display: grid; gap: 8px; margin-bottom: 12px; }
  .person { display: flex; gap: 10px; align-items: center; padding: 6px 8px; background: rgba(255,255,255,.06); border-radius: 10px; }
  .person img { width: 56px; height: 56px; flex: none; }
  .person img.unknown { filter: brightness(0) drop-shadow(0 0 1px #ff4d4d); }
  .person b { display: block; font: 800 15px var(--display); letter-spacing: 1px; }
  .person span { display: block; font-size: 12px; opacity: .8; line-height: 1.3; }
  .person em { display: block; font-style: normal; font-size: 12px; color: #ffd27a; margin-top: 2px; }
  .maplegend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 10px; }
  .maplegend img { width: 22px; height: 22px; margin-right: 6px; vertical-align: -6px; }
  .mapstats { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; opacity: .9; }
  .mapstats b { color: #ffd27a; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 12px; font-size: 14px; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .menu-toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; background: #1d2a38; font-weight: 700; }

  /* ------------------------------------------------ shop and workshop screens */
  .hud-panel { display: none; position: absolute; right: 28px; top: 228px; width: 420px; padding: 16px 18px 14px; background: linear-gradient(160deg, rgba(10,14,30,.94), rgba(22,18,40,.9)); border-top: 4px solid var(--sun); border-radius: 10px; text-shadow: none; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .p-title { font: 900 22px var(--display); letter-spacing: 3px; }
  .p-sub { font-size: 12px; opacity: .75; margin-top: 3px; }
  .p-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 6px; }
  .p-tabs span { padding: 3px 8px; border-radius: 10px; font: 700 12px var(--font); background: rgba(255,255,255,.07); opacity: .6; }
  .p-tabs span.on { background: rgba(255,255,255,.2); opacity: 1; box-shadow: inset 0 -2px 0 currentColor; }
  .p-rows { display: grid; gap: 2px; margin-top: 8px; max-height: calc(100vh - 380px); overflow: hidden; }
  .p-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 15px; border-left: 3px solid transparent; }
  .p-row span { flex: 1; }
  .p-row b { font-weight: 600; font-size: 13px; color: #d9e2ff; white-space: nowrap; }
  .p-row em { font-style: normal; min-width: 70px; text-align: right; font: 800 13px var(--display); letter-spacing: 1px; color: #8dff9e; }
  .p-row i { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .p-row.sel { background: rgba(255,255,255,.12); border-left-color: var(--sun); }
  .p-row.dim em { color: #ff8a80; }
  .p-row.good em { color: #ffd27a; }
  .p-foot { margin-top: 10px; font-size: 11px; opacity: .65; line-height: 1.4; }
  .hud-fade { position: absolute; inset: 0; background: #05060c; opacity: 0; pointer-events: none; }
  table.kv.acts td { vertical-align: top; padding: 7px 22px 7px 0; }
  table.kv.acts small { display: block; font-size: 12px; opacity: .65; color: #fff; margin-top: 2px; }
  .medal { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 8px; font: 800 11px var(--display); letter-spacing: 1px; color: #1d1f2b; }
  .medal.gold { background: #ffd23f; } .medal.silver { background: #d8e2ec; } .medal.bronze { background: #e09a5a; }
  .maplegend { grid-template-columns: 1fr 1fr; font-size: 12px; }

  /* ------------------------------------------------ photo mode */
  .photo-ui { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 10px 22px; border-radius: 22px; background: rgba(10,14,30,.6); text-align: center; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .photo-ui b { font: 900 16px var(--display); letter-spacing: 4px; color: var(--sun); margin-right: 10px; }
  .photo-ui span { font: 700 15px var(--font); }
  .photo-ui small { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmara Bay: an open-world crime game"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<div id="loading">SOLMARA BAY</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
